# /etc/nginx/sites-available/ideas
# Reverse proxy gunicorn (Unix socket) + static/media + rate limiting.
#
# Después de copiar este archivo, certbot agrega automáticamente los
# bloques de SSL y el redirect http→https en el paso 6.

# Rate limit zone: 10 requests/segundo por IP para endpoints sensibles.
# Aplicamos solo a login + admin — el resto del sitio queda sin limite
# (el cliente puede cargar muchas páginas en poco tiempo legítimamente).
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/s;

upstream ideas_app {
    # Socket Unix gestionado por systemd (ver gunicorn-ideas.socket).
    server unix:/run/gunicorn-ideas.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name ideasboutique.cl www.ideasboutique.cl;

    # Certbot agrega aca un return 301 https://... después del paso 6.
    # Mientras tanto servimos http para que certbot pueda hacer su
    # challenge en /.well-known/acme-challenge/.

    # ── Limites generales ────────────────────────────────────────────
    client_max_body_size 6m;            # 5 MB de uploads + buffer
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65s;
    send_timeout 30s;

    # ── Rate limit en login + admin ──────────────────────────────────
    # django-axes es defensa en profundidad — esto bloquea ANTES de
    # llegar a Django, ahorrando CPU contra fuerza-bruta masiva.
    location ~ ^/cuenta/login {
        limit_req zone=login_limit burst=20 nodelay;
        proxy_pass http://ideas_app;
        include /etc/nginx/proxy_params;
    }

    # ── Static files (servidos directamente por nginx) ───────────────
    # WhiteNoise tambien los sirve, pero nginx es ~10x mas rapido. El
    # `expires` agresivo confía en el hash de CompressedManifestStorage.
    location /static/ {
        alias /srv/ideas/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media files (fotos de productos subidos por el admin) ────────
    location /media/ {
        alias /srv/ideas/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        # Defense: nunca interpretar PHP/CGI en /media/ (por si alguien
        # sube un archivo malicioso). Servimos siempre como bytes.
        location ~* \.(php|cgi|pl|asp|aspx|jsp)$ {
            return 403;
        }
    }

    # ── Bloquear paths sensibles ─────────────────────────────────────
    location ~ /\.(env|git|claude|venv|backups) {
        deny all;
        access_log off;
    }
    location ~ \.(sqlite3|sql|log|pem|key)$ {
        deny all;
        access_log off;
    }

    # ── Health check (interno) ───────────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }

    # ── Robots.txt — Django lo sirve dinamicamente ───────────────────
    # (no override aca para que el sitemap stay-in-sync con ADMIN_URL)

    # ── Resto: pasar a gunicorn ──────────────────────────────────────
    location / {
        proxy_pass http://ideas_app;
        include /etc/nginx/proxy_params;
    }

    # Logs
    access_log /var/log/nginx/ideas.access.log;
    error_log  /var/log/nginx/ideas.error.log warn;
}
