# ════════════════════════════════════════════════════════════════════════
# Plausible Community Edition — self-hosted analytics para ideasboutique.cl
# ════════════════════════════════════════════════════════════════════════
# Stack: Plausible v3 + Postgres 16 (config + users) + ClickHouse (events).
#
# Setup:
#   1. Copiar plausible.env.template -> .env y completar SECRET_KEY_BASE
#   2. docker compose up -d
#   3. Visitar https://plausible.ideasboutique.cl y crear el primer admin
#   4. Despues setear DISABLE_REGISTRATION=true en .env y `docker compose up -d`
#      para no permitir registros publicos.
#
# Puerto expuesto: 127.0.0.1:8000 (no bindea publicamente — nginx hace el
# reverse proxy + TLS via Let's Encrypt).
#
# Datos persistentes:
#   - plausible_postgres_data  (config, users, sites)
#   - plausible_clickhouse_data (events — la mayoria del disco)
#   - plausible_clickhouse_logs
#
# Backups: pg_dump del postgres + clickhouse-backup. Ver README.md.
# ════════════════════════════════════════════════════════════════════════

services:
  plausible_db:
    image: postgres:16-alpine
    container_name: plausible_db
    restart: always
    volumes:
      - plausible_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=plausible_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  plausible_events_db:
    image: clickhouse/clickhouse-server:24.12-alpine
    container_name: plausible_events_db
    restart: always
    volumes:
      - plausible_clickhouse_data:/var/lib/clickhouse
      - plausible_clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/logging.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  plausible:
    image: ghcr.io/plausible/community-edition:v3.0.1
    container_name: plausible
    restart: always
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    ports:
      # Solo localhost — nginx hace el reverse proxy publico.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@plausible_db:5432/plausible_db
      - CLICKHOUSE_DATABASE_URL=http://plausible_events_db:8123/plausible_events_db

volumes:
  plausible_postgres_data:
  plausible_clickhouse_data:
  plausible_clickhouse_logs:
