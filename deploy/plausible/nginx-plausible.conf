# ════════════════════════════════════════════════════════════════════════
# nginx site config — plausible.ideasboutique.cl
# ════════════════════════════════════════════════════════════════════════
# Copiar a /etc/nginx/sites-available/plausible y simlinkear a sites-enabled.
# Despues correr `certbot --nginx -d plausible.ideasboutique.cl` para que
# certbot inserte el bloque TLS automaticamente y haga el redirect 80→443.
#
# Plausible CE escucha en 127.0.0.1:8000 (no expone al publico) — nginx
# hace el reverse proxy + TLS + ratelimit.
# ════════════════════════════════════════════════════════════════════════

# Rate limit para defender contra script kiddies. 5 req/s con burst de 10
# es generoso pero corta floods. Plausible es API + dashboard, no recibe
# trafico masivo legitimo.
limit_req_zone $binary_remote_addr zone=plausible_zone:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name plausible.ideasboutique.cl;

    # certbot maneja el redirect a HTTPS — al correr `certbot --nginx`
    # va a insertar aca un `return 301 https://...;` y agregar el server
    # block de 443.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Plausible usa websocket para live views del dashboard.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Ratelimit. Excepcion: el endpoint /api/event/ es el que recibe
        # pings de tracking — esos no deberian limitarse o se pierden
        # events legitimos. Si tu sitio recibe mas de 5 req/s reales en
        # serio, ajustar la rate del limit_req_zone.
        limit_req zone=plausible_zone burst=20 nodelay;

        # Timeouts: el dashboard puede tardar en queries grandes. 60s
        # default de nginx es justo, subimos a 120 por las dudas.
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;

        # Body size: eventos custom con props pesados (raro pero posible).
        client_max_body_size 1m;
    }
}

# El bloque server { listen 443 ssl; ... } lo agrega certbot solo.
# Si en algun momento queres editarlo manualmente, esta en este mismo
# archivo, debajo del bloque 80.
