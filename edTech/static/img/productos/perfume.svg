<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <rect width="400" height="500" fill="#FBF8F3"/>
  <!-- frasco -->
  <g>
    <!-- líquido (gradiente dorado) -->
    <defs>
      <linearGradient id="liq" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#E5C896"/>
        <stop offset="1" stop-color="#C9A96E"/>
      </linearGradient>
    </defs>
    <rect x="155" y="220" width="90" height="160" rx="6" fill="url(#liq)"/>
    <!-- vidrio (overlay translúcido) -->
    <rect x="150" y="215" width="100" height="170" rx="8"
          fill="none" stroke="#1A1A1A" stroke-width="3"/>
    <!-- cuello -->
    <rect x="180" y="180" width="40" height="40" fill="#1A1A1A"/>
    <!-- tapa -->
    <rect x="170" y="140" width="60" height="45" rx="4" fill="#C9A96E" stroke="#8B7A5A" stroke-width="2"/>
    <!-- etiqueta -->
    <rect x="170" y="265" width="60" height="40" fill="#FBF8F3" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="200" y="280" font-family="Cormorant Garamond,Georgia,serif"
          font-size="13" font-style="italic" font-weight="600"
          fill="#1A1A1A" text-anchor="middle">Ideas</text>
    <text x="200" y="296" font-family="Inter,sans-serif"
          font-size="8" fill="#8B7A5A" text-anchor="middle"
          letter-spacing="0.18em">PARFUM</text>
  </g>
  <text x="200" y="455" font-family="Inter,sans-serif" font-size="14"
        font-weight="700" fill="#8B7A5A" text-anchor="middle"
        letter-spacing="0.15em">PERFUME</text>
</svg>
