<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1F2A"/>
      <stop offset="100%" stop-color="#2B3140"/>
    </linearGradient>
  </defs>
  <!-- Fondo con safe area para mascarables (10% padding) -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Logo "I" con serifa estilo Cormorant -->
  <g fill="#C9A96E" transform="translate(256 256)">
    <!-- Serifa superior -->
    <rect x="-72" y="-128" width="144" height="20"/>
    <!-- Cuerpo -->
    <rect x="-16" y="-108" width="32" height="216"/>
    <!-- Serifa inferior -->
    <rect x="-72" y="108" width="144" height="20"/>
  </g>
  <!-- Detalle de subrayado dorado -->
  <line x1="160" y1="384" x2="352" y2="384" stroke="#C9A96E" stroke-width="3" opacity="0.5"/>
</svg>
