{% comment %}
  Base email template — todos los emails extienden este.
  CSS INLINE obligatorio (Gmail/Outlook/Apple Mail ignoran <style>).
  Ancho 600px, tablas en vez de divs por compatibilidad Outlook.
  Bloques:
    {% block preheader %}  texto preview en bandeja de entrada (oculto en cuerpo)
    {% block heading %}    título grande tipo H1 (serif dorado)
    {% block body %}       contenido principal
    {% block cta %}        botón CTA opcional
    {% block footer_extra %} info extra antes del footer estándar
{% endcomment %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block titulo %}Ideas Boutique{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#F5EFE4;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Arial,sans-serif;color:#0E0E0E;-webkit-font-smoothing:antialiased;">

  {# Preheader oculto — texto que asoma en la bandeja al lado del subject #}
  <div style="display:none;max-height:0;overflow:hidden;font-size:1px;line-height:1px;color:#F5EFE4;mso-hide:all;">
    {% block preheader %}Ideas Boutique · Caupolicán 437-B, Los Vilos · Desde 1987{% endblock %}
  </div>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#F5EFE4;">
    <tr><td align="center" style="padding:32px 12px;">

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;max-width:100%;background:#FBF7EE;border:1px solid #E5DCC8;border-radius:14px;overflow:hidden;">

        {# ============== HEADER ============== #}
        <tr><td style="background:#0E0E0E;padding:28px 32px;text-align:center;">
          {# Logo SVG inline para que se vea sin pedir imagen #}
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center"><tr>
            <td style="vertical-align:middle;padding-right:14px;">
              <svg width="44" height="44" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <circle cx="32" cy="32" r="28" stroke="#C9A96E" stroke-width="1.6" fill="none"/>
                <circle cx="32" cy="32" r="22" stroke="#C9A96E" stroke-width="0.9" fill="none" opacity="0.55"/>
                <text x="32" y="44" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="32" font-weight="600" fill="#C9A96E">i</text>
              </svg>
            </td>
            <td style="vertical-align:middle;text-align:left;">
              <div style="font-family:Georgia,'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:#C9A96E;letter-spacing:3px;line-height:1;">IDEAS</div>
              <div style="font-family:'Inter',Arial,sans-serif;font-size:10px;color:#C9A96E;letter-spacing:5px;margin-top:4px;opacity:0.85;">BOUTIQUE</div>
            </td>
          </tr></table>
        </td></tr>

        {# ============== HEADING ============== #}
        <tr><td style="padding:36px 40px 0;">
          <h1 style="font-family:Georgia,'Cormorant Garamond',serif;font-size:32px;font-weight:600;line-height:1.15;color:#0E0E0E;margin:0 0 8px;letter-spacing:-0.005em;">
            {% block heading %}Ideas Boutique{% endblock %}
          </h1>
        </td></tr>

        {# ============== BODY ============== #}
        <tr><td style="padding:18px 40px 28px;font-size:15px;line-height:1.6;color:#1F1F1F;">
          {% block body %}{% endblock %}
        </td></tr>

        {# ============== CTA opcional ============== #}
        {% block cta_wrapper %}
        <tr><td style="padding:0 40px 32px;">
          {% block cta %}{% endblock %}
        </td></tr>
        {% endblock %}

        {# ============== FOOTER EXTRA (opcional, antes del bloque estándar) ============== #}
        {% block footer_extra %}{% endblock %}

        {# ============== FOOTER ============== #}
        <tr><td style="background:#0E0E0E;color:rgba(245,239,228,0.7);padding:28px 40px;font-size:12.5px;line-height:1.6;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
            <tr>
              <td style="vertical-align:top;">
                <div style="font-family:Georgia,serif;font-size:16px;color:#C9A96E;font-style:italic;margin-bottom:6px;">Familia Contreras</div>
                <div style="color:rgba(245,239,228,0.85);">Caupolicán 437-B · Los Vilos</div>
                <div>Lun a Sáb · 9:00 – 19:00</div>
              </td>
              <td style="vertical-align:top;text-align:right;">
                {% if PUBLIC_WHATSAPP %}<a href="https://wa.me/{{ PUBLIC_WHATSAPP }}" style="color:#C9A96E;text-decoration:none;">WhatsApp</a><br>{% endif %}
                <a href="{{ SITE_URL|default:'https://ideasboutique.cl' }}" style="color:#C9A96E;text-decoration:none;">ideasboutique.cl</a>
              </td>
            </tr>
          </table>
          <div style="border-top:1px solid rgba(245,239,228,0.15);margin:18px 0 10px;"></div>
          <div style="font-size:11px;color:rgba(245,239,228,0.5);">
            Tres generaciones en Los Vilos, desde 1987.
            {% block footer_legal %}
            Si no querés recibir más correos, <a href="{% block unsub_url %}#{% endblock %}" style="color:rgba(245,239,228,0.7);">date de baja acá</a>.
            {% endblock %}
          </div>
        </td></tr>

      </table>

    </td></tr>
  </table>

</body>
</html>
