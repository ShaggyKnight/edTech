{% comment %}
  Sprite SVG con todos los íconos del sistema. Se incluye una sola vez
  (p. ej. al inicio del body) y después se referencian con:

      <svg class="ico"><use href="#ico-truck"/></svg>

  El tamaño se controla con width/height o CSS. Color con `currentColor`.
{% endcomment %}
